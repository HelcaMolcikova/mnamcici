<style>
:root{--bg:#FAF6F2;--surface:#FFFFFF;--ink:#2E211C;--muted:#7A6A62;--line:#EFE4DC;--line2:#DCC7B9;--accent:#B4533A;--accent-ink:#FFFFFF;--note:#F6E2D8;--note-ink:#5A2A1C;
  --r-md:16px;--r-sm:10px;--font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:light}
:root[data-theme="dark"]{--bg:#1B1614;--surface:#272020;--ink:#F5ECE6;--muted:#BCA99E;--line:#3B302C;--line2:#5E4A42;--accent:#E28C70;--accent-ink:#2A140D;--note:#48302A;--note-ink:#FCE5DA;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px;margin:32px 0 12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 32px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* hlavička a menu */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1080px;margin:0 auto;padding:14px 16px 0;min-height:50px}
.brand{font-weight:700;font-size:18px;text-decoration:none;border-radius:6px}
.menu{display:none;gap:4px;align-items:center}
.menu a{position:relative;text-decoration:none;color:var(--muted);font-weight:550;padding:6px 12px;border-radius:6px}
.menu a:hover{color:var(--ink)}
.menu a.on{color:var(--ink)}
.menu a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-3px;height:2px;border-radius:2px;background:var(--accent)}
.rezim{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted);margin-left:8px}
.rezim:hover{color:var(--ink)}
.rezim svg{width:20px;height:20px}
.dole{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.dole a{position:relative;flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:14px;font-weight:550;padding:10px 4px;border-radius:var(--r-sm)}
.dole a.on{color:var(--ink);font-weight:650}
.dole a.on::before{content:"";position:absolute;top:-6px;left:50%;width:24px;margin-left:-12px;height:2px;border-radius:2px;background:var(--accent)}
@media(min-width:800px){
  body{padding-bottom:0}
  .menu{display:flex;margin-right:-12px}
  .dole{display:none}
}

/* týden */
.top{margin:4px 0 20px}
.top p{margin:6px 0 0}
.tyden{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.tyden{grid-template-columns:repeat(2,1fr)}}
.hlavicka{display:none}
.den{background:var(--surface);border-radius:var(--r-md);padding:14px 16px 10px}
.den.vari{box-shadow:inset 3px 0 0 var(--accent)}
.den.dnes{box-shadow:inset 0 0 0 1.5px var(--accent)}
.den.vari.dnes{box-shadow:inset 3px 0 0 var(--accent),inset 0 0 0 1.5px var(--accent)}
.den-nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.den-nm h3{font-size:16px}
.den-nm span{font-size:14px;color:var(--muted)}
.varis{margin:4px 0 6px;font-size:14px;color:var(--muted)}
.varis b{color:var(--accent);font-weight:650}
.varis b::after{content:":"}
.varis .v+.v::before{content:", "}
.slot{margin-top:4px}
.slot.prazdne{display:none}
.jidlo{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;padding:7px 10px;margin:0 -10px;border-radius:var(--r-sm);text-decoration:none}
.jidlo+.jidlo{margin-top:2px}
a.jidlo:hover{background:var(--bg)}
.jidlo .kdy{font-size:13px;color:var(--muted)}
.jidlo .co{font-weight:600}
.jidlo .pozn{font-size:14px;color:var(--muted)}
.volno{font-size:14px;color:var(--muted);margin:8px 0 4px}
@media(min-width:900px){
  .tyden{display:block;background:var(--surface);border-radius:var(--r-md);padding:4px 0}
  .hlavicka,.den{display:grid;grid-template-columns:190px repeat(3,minmax(0,1fr));gap:0 12px;align-items:start;padding:0 20px}
  .hlavicka{padding-top:14px;padding-bottom:10px}
  .hlavicka span{font-size:13px;font-weight:600;color:var(--muted);padding:0 10px}
  .den{background:none;border-radius:0;border-top:1px solid var(--line);padding-top:14px;padding-bottom:14px}
  .den.dnes,.den.vari.dnes{border-radius:var(--r-sm)}
  .den-nm{display:block}
  .den-nm span{display:block;margin-top:1px}
  .varis{margin-top:8px}
  .varis b{display:block}
  .varis b::after{content:none}
  .varis .v{display:block}
  .varis .v+.v::before{content:none}
  .slot,.slot.prazdne{display:block;margin:-7px 0}
  .slot.prazdne::before{content:"-";display:block;padding:8px 10px;color:var(--line2)}
  .jidlo{display:block;margin:0}
  .jidlo .kdy{display:none}
  .jidlo .co{display:block}
  .jidlo .pozn{display:block;margin-top:1px}
  .volno{display:none}
}

/* nákup */
.nakup{columns:1;column-gap:28px}
@media(min-width:800px){.nakup{columns:2}}
.skupina{break-inside:avoid;background:var(--surface);border-radius:var(--r-md);padding:12px 16px;margin:0 0 12px}
.skupina h3{font-size:13px;color:var(--muted);font-weight:600;margin:2px 0 4px}
.pol{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.skupina h3+.pol{border-top:0}
.pol input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.pol .nm{flex:1}
.pol .mn{color:var(--muted);white-space:nowrap}
.pol .pro{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.pol.ok .nm,.pol.ok .mn{opacity:.45;text-decoration:line-through}
details.spiz{margin-top:6px}
details.spiz summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--muted);border-radius:6px}
details.spiz summary:hover{color:var(--ink)}
.akce{display:flex;gap:10px;flex-wrap:wrap;margin:-4px 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:var(--r-sm);padding:10px 16px;min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}

/* recepty */
.karty{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.karty{grid-template-columns:repeat(3,1fr)}}
.karta{display:block;background:var(--surface);border-radius:var(--r-md);padding:14px 16px 16px;text-decoration:none;overflow:hidden}
a.karta:hover .nm{color:var(--accent)}
.karta img{display:block;width:calc(100% + 32px);margin:-14px -16px 14px;aspect-ratio:4/3;object-fit:cover}
.recept .foto{display:block;max-width:100%;max-height:520px;width:auto;height:auto;border-radius:var(--r-md);margin:0 0 18px}
.karta .nm{display:block;font-weight:600;font-size:16px}
.karta .meta{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.recept .zpet{display:inline-block;margin:0 0 16px;color:var(--muted);text-decoration:none;font-weight:550;border-radius:6px}
.recept .zpet:hover{color:var(--ink)}
.recept .meta{margin:6px 0 0;color:var(--muted)}
.recept .poznamka{background:var(--surface);border-radius:var(--r-sm);box-shadow:inset 3px 0 0 var(--line2);padding:12px 16px;margin:16px 0 0;font-size:15px}
.recept .poznamka p{margin:0}
.recept .poznamka p+p{margin-top:6px}
.dva{display:grid;gap:8px 32px}
@media(min-width:800px){.dva{grid-template-columns:2fr 3fr}}
.recept ul,.recept ol{margin:0;padding-left:20px}
.recept li{margin:0 0 8px}
.recept ul li span{color:var(--muted)}
.recept ul li b{font-weight:600}
.porce{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.porce button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);text-align:center;font-size:18px}
.porce button:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.recept a{text-decoration-color:var(--line2);text-underline-offset:3px}
</style>

<script>
/* ===== Recepty =====

  zelenina:   { n: 'Zelenina k chlebu', j: '', o: 'Ovoce a zelenina' },
  horcice:    { n: 'Hořčice', j: '', o: 'Doma' },
  sadlo:      { n: 'Sádlo', j: '', o: 'Doma' },
  strouhanka: { n: 'Strouhanka', j: '', o: 'Doma' },
  sul:        { n: 'Sůl', j: '', o: 'Doma' },
  pepr:       { n: 'Pepř', j: '', o: 'Doma' },
  maslo:      { n: 'Máslo', j: '', o: 'Doma' },
  mouka:      { n: 'Hladká mouka', j: '', o: 'Doma' },
  krupice:    { n: 'Krupice nebo polohrubá mouka', j: '', o: 'Doma' },
  bobkac:     { n: 'Bobkový list', j: '', o: 'Doma' },
  noveKor:    { n: 'Nové koření', j: '', o: 'Doma' },
  skorice:    { n: 'Skořice', j: '', o: 'Doma' },
  cukr:       { n: 'Cukr', j: '', o: 'Doma' },

const RECEPTY = {
  sunkofleky: {
    nazev: 'Šunkofleky', kratce: 'Šunkofleky', foto: 'fotky/sunkofleky.jpg', porce: 4, cas: '55 min', lednice: 'večeře a druhý den oběd',
    suroviny: [
      ['fleky', 500], ['uzene', 200, 'nakrájet na menší kousky'], ['vejce', 6], ['smetana', 250],
      ['cesnek', 2], ['petrzel', 1], ['sadlo', null, 'na vymazání pekáče'], ['strouhanka', null, 'na vysypání pekáče'],
      ['sul', null], ['pepr', null], ['okurky', null, 'k podávání'],
    ],
    postup: [
      'Troubu předehřej na 170 °C. Pekáč vymaž sádlem a vysyp strouhankou.',
      'Česnek prolisuj. Vejce rozmíchej se smetanou, mléko nepřidávej. Uzené maso nakrájej na menší kousky.',
      'Fleky vař v osolené vodě do poloměkka: když mají na obalu 13 minut, stačí asi 8-9 minut. Slij.',
      'Ještě teplé fleky smíchej s masem, petrželí, česnekem, lžičkou soli a špetkou pepře. Přidej vaječnou směs a promíchej.',
      'Dej do pekáče a peč 35 minut. Potom nech 15 minut dojít ve vypnuté troubě.',
      'Podávej s nakládanými okurkami.',
    ],
    poznamky: [
      'Vyzkoušeno 29. 8. 2026: S Honzou jste se shodli, že stačí přibližně 200 g uzeniny. Použila jsi celou smetanu 250 g a mléko vůbec.',
      'Nejlepší je zapéct fleky ještě teplé, ne ze studených těstovin.',
    ],
    zdroj: 'https://www.rohlik.cz/chef/71-sunkofleky',
  },
  rajska: {
    nazev: 'Rajská polévka od maminky', kratce: 'Rajská polévka', foto: 'fotky/rajska-servirovani.png', porce: null, cas: '30 min', lednice: 'večeře a druhý den oběd',
    suroviny: [
      ['maslo', null], ['mouka', null, 'lžíce na zásmažku'], ['protlak', null], ['kecup', null, 'trošku'],
      ['bobkac', null], ['noveKor', null], ['skorice', null, 'lusk nebo čajová lžička mleté'], ['cukr', null, 'trošku'], ['sul', null],
      ['vejce', 1, 'na kapání'], ['krupice', null, 'do kapání'],
    ],
    postup: [
      'Máslo do hrnce, trošku rozpustit a přidat lžíci hladké mouky. Míchat, dokud není zásmažka mírně nažloutlá, nemusí být zlatá.',

    suroviny: [

    ],
    poznamky: ['Vyšla vám na večeři pro dva s chlebíkem a se zeleninou. Klidně by snesla i víc paloučků.'],

    suroviny: [['vlocky', 50], ['jogurt', 150], ['mleko', 80], ['jablko', 1], ['skorice', null, 'lžička']],

/* ===== Týden =====
   Plán je společný pro všechny, kdo otevřou odkaz. Mění ho agent v tomto souboru.
   vari: co se ten den uvaří (recept a počet porcí, ze kterých se počítá nákup).
   uvareno: už hotová jídla bez dalšího nákupu.
   jidla: co se jí; recept = odkaz na recept, od = kdo jídlo přinesl, pozn = drobnost navíc,
   chystas = rychlé jídlo připravené ten den (počet porcí jde do nákupu). */
const TYDEN = {
  od: '2026-11-15',
  dny: [
    { uvareno: [{recept:'sunkofleky'}, {co:'Dýňovo-jablečný koláč z vloček'}],
      prikrmNavrh: 'Zelenina s vařenou hruškou nebo jablkem. Konkrétní kombinaci ještě vybereme.',

        { kdy: 'Oběd', co: 'Zapečené maso s bramborami', od: 'od maminky' },
        { kdy: 'Večeře', recept: 'sunkofleky', pozn: 'už upečené' },
      ] },
    { jidla: [
        { kdy: 'Snídaně', co: 'Dýňovo-jablečný koláč z vloček', pozn: 'pro Helču, už upečený' },
        { kdy: 'Oběd', recept: 'sunkofleky', pozn: 'z neděle' },
        { kdy: 'Večeře', recept: 'sardinkova', chystas: 2, pozn: 'za 10 minut, s chlebem a zeleninou' },
      ] },
    { vari: [['rajska', null], ['oats', 2]],
      jidla: [
        { kdy: 'Snídaně', co: 'Dýňovo-jablečný koláč z vloček', pozn: 'pro Helču, už upečený' },
        { kdy: 'Večeře', recept: 'rajska' },
      ] },
    { jidla: [
        { kdy: 'Snídaně', recept: 'oats', pozn: 'pro Helču' },
        { kdy: 'Oběd', recept: 'rajska', pozn: 'z úterý' },
      ] },
    { jidla: [{ kdy: 'Snídaně', recept: 'oats', pozn: 'pro Helču' }] },
    { jidla: [] },
    { jidla: [] },
  ],
};

/* ===== Příkrmy pro Aničku =====
   Směsi zeleniny a ovoce na zkoušení, seřazené od nejjistější. */
const PRIKRMY = {
  smesi: [
    { nm: 'Máslová dýně s hruškou', foto: 'fotky/prikrm-dyne-hruska.png', pozn: 'Máslová je sladší a jemnější než hokkaido a hladce se rozmixuje. Na rozdíl od hokkaida ji oloupej.' },
    { nm: 'Hokkaido s jablkem', foto: 'fotky/prikrm-hokkaido-jablko.png', pozn: 'Hokkaido 14. 11. Aničce docela nevadilo. Jablko k němu podus do měkka.' },
    { nm: 'Batát s jablkem', foto: 'fotky/prikrm-batat-jablko.png', pozn: 'Podobně sladké jako dýně.' },
    { nm: 'Brokolice nebo cuketa s hruškou', foto: 'fotky/prikrm-brokolice-hruska.png', pozn: 'Hruška přebije hořčí nebo nevýraznou chuť. Cuketa jí sama nechutnala, takhle ji můžeš zkusit znovu.' },
    { nm: 'Mrkev s jablkem', foto: 'fotky/prikrm-mrkev-jablko.png', pozn: 'Mrkev zatím moc nemusí, hovězí s mrkví nechtěla. Klidně ji zkus znovu, chuť se často přijme až po víc ochutnáních.' },
  ],
  postup: [
    'Zeleninu nakrájej na kousky a vař v páře nebo ve vodě do měkka, asi 15-20 minut.',
    'Jablko nebo hrušku oloupej a podus do měkka, asi 5-10 minut. Syrové je pro bříško tvrdší.',
    'Rozmixuj zhruba 2 díly zeleniny na 1 díl ovoce, aby zelenina byla cítit. Zřeď vodou z vaření nebo mlékem.',
    'Bez soli a cukru.',
  ],
  pravidla: [
    'Do jedné směsi nejvýš jednu novou potravinu, ostatní ať zná. Při vyrážce nebo bolavém bříšku pak víš, co to bylo.',
    'Zeleninu dál nabízej i samotnou, i tu, kterou odmítla. Novou chuť dítě často přijme až po 8-10 ochutnáních.',
    'Ovoce můžeš dávat i samotné. Na čekání, až začne zeleninu jíst, nic nestojí: výzkum podporuje jen první asi 4 týdny hlavně zeleniny a ty už má za sebou.',
    'Každý den něco se železem: maso, luštěniny, vajíčko. Zásoby železa kolem 7. měsíce docházejí.',
    'Dvě lžičky jsou úspěch. Když nechce, nenutit, hlavní je pořád mléko.',
  ],
};

/* ===== Pomocné ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DNY = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
const dnyTydne = () => TYDEN.dny.map((d, i) => {
  const dt = new Date(TYDEN.od + 'T12:00:00'); dt.setDate(dt.getDate() + i);
  return { ...d, dt };
});
const datum = dt => dt.getDate() + '. ' + (dt.getMonth() + 1) + '.';
const stejnyDen = (a, b) => a.toDateString() === b.toDateString();
const cislo = x => Math.round(x * 10) / 10;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} },
};

/* ===== Týden ===== */
function vykresliTyden() {
  const dnes = new Date();
  const dny = dnyTydne();
  const prvni = dny[0].dt, posledni = dny[dny.length - 1].dt;
  const SLOTY = ['Snídaně', 'Oběd', 'Večeře'];
  let h = `<div class="top"><h1>Týden ${datum(prvni)} - ${datum(posledni)}</h1>
    <p class="muted">Vaříme v neděli a v úterý večer.</p></div>
    <div class="tyden"><div class="hlavicka" aria-hidden="true"><span></span>${SLOTY.map(s => `<span>${s}</span>`).join('')}<span>Anička</span></div>`;
  const vcera = {};
  const jidlo = (j, opak) => {
    const nm = j.recept ? (RECEPTY[j.recept].kratce || RECEPTY[j.recept].nazev) : j.co;
    const pozn = j.od || (opak ? '' : j.pozn) || '';
    const tag = j.recept ? 'a' : 'div';
    return `<${tag} class="jidlo"${j.recept ? ` href="#recept/${j.recept}"` : ''}><span class="kdy">${esc(j.kdy)}</span><span><span class="co">${esc(nm)}</span>${pozn ? ` <span class="pozn">${esc(pozn)}</span>` : ''}</span></${tag}>`;
  };
  for (const d of dny) {
    const tridy = ['den', d.vari ? 'vari' : '', stejnyDen(d.dt, dnes) ? 'dnes' : ''].filter(Boolean).join(' ');
    h += `<section class="${tridy}"><div><div class="den-nm"><h3>${DNY[d.dt.getDay()]}</h3><span>${stejnyDen(d.dt, dnes) ? 'dnes, ' : ''}${datum(d.dt)}</span></div>`;
    if (d.vari) {
      h += `<p class="varis"><b>Vaříš</b> ${d.vari.map(([id, p]) => `<span class="v">${esc(RECEPTY[id].kratce) + (p && RECEPTY[id].porce === 1 ? ' ×' + p : '')}</span>`).join('')}</p>`;
    }
    if (!d.jidla.length) h += `<p class="volno">Volno</p>`;
    h += `</div>`;
    // jídla mimo snídani, oběd a večeři přidá do posledního sloupce
    const sloty = SLOTY.map(s => d.jidla.filter(j => j.kdy === s));
    sloty[2].push(...d.jidla.filter(j => !SLOTY.includes(j.kdy)));
    // poznámka, která se den po dni opakuje u stejného jídla (pro Helču), stačí poprvé
    h += sloty.map((v, i) => {
      const klice = v.map(j => (j.recept || j.co) + '|' + (j.pozn || ''));
      const html = v.map((j, k) => jidlo(j, (vcera[i] || []).includes(klice[k]))).join('');
      vcera[i] = klice;
      return `<div class="slot${v.length ? '' : ' prazdne'}">${html}</div>`;
    }).join('');
    h += `<div class="slot">${PrikrmyApp.dayCard(PrikrmyApp.core.localDate(d.dt))}</div></section>`;
  }
  $('#obsah').innerHTML = h + '</div>';
  PrikrmyApp.bindDayButtons($('#obsah'));
}

/* ===== Nákup ===== */
const KLIC_VLASTNI_NAKUP = 'molcuchyne-vlastni-nakup-' + TYDEN.od;
let nakupProblem = '';
function nactiVlastniNakup() {
  try {
    const raw=localStorage.getItem(KLIC_VLASTNI_NAKUP),items=raw?JSON.parse(raw):[];
    if(!Array.isArray(items)||items.length>1000||!items.every(x=>x&&typeof x.id==='string'&&/^vlastni-[a-zA-Z0-9-]+$/.test(x.id)&&typeof x.name==='string'&&x.name.trim()&&x.name.length<=200&&typeof x.amount==='string'&&x.amount.length<=80&&typeof x.checked==='boolean')||new Set(items.map(x=>x.id)).size!==items.length)throw Error('Neplatné vlastní položky');
    nakupProblem='';return items;
  }catch{nakupProblem='Vlastní položky se nepodařilo načíst. Původní data zůstala zachovaná.';return [];}
}
function ulozVlastniNakup(items) {
  nactiVlastniNakup();if(nakupProblem)throw Error(nakupProblem);
  try{localStorage.setItem(KLIC_VLASTNI_NAKUP,JSON.stringify(items));}catch{throw Error('Položka se neuložila. Prohlížeč nepovolil zápis nebo je plný.');}
}
function vlastniPolozky() {
  return nactiVlastniNakup().map(x=>({k:x.id,n:x.name,mnozstviText:x.amount,m:0,j:'',o:'Vlastní položky',pro:new Set(['Přidáno ručně']),vlastni:true,hotovo:x.checked}));
}
function jeHotovo(p,hotovo) {return p.vlastni?p.hotovo:hotovo.includes(p.k);}
function nakupOznam(text) {const n=document.querySelector('#nakup-status');if(n)n.textContent=text;}

function seznam() {
  const pol = {};
  const k_vareni = d => [...(d.vari || []), ...d.jidla.filter(j => j.chystas).map(j => [j.recept, j.chystas])];
  for (const d of dnyTydne()) for (const [id, porce] of k_vareni(d)) {
    const r = RECEPTY[id];
    const krat = porce && r.porce ? porce / r.porce : 1;
    for (const [k, m] of r.suroviny) {
      const p = pol[k] || (pol[k] = { k, ...SUROVINY[k], m: 0, bezMnozstvi: false, pro: new Set() });
      if (m == null) p.bezMnozstvi = true; else p.m += m * krat;
      p.pro.add(r.kratce);
    }
  }
  for (const item of PrikrmyApp.shopping()) {
    const k = SUROVINY[item.id] ? item.id : 'prikrm-' + item.id;
    const s = SUROVINY[item.id];
    const p = pol[k] || (pol[k] = {k, n:s?.n || item.name, j:s?.j || '', o:s?.o || item.group || 'Ovoce a zelenina', m:0, bezMnozstvi:true, pro:new Set()});
    p.bezMnozstvi = true;
    p.pro.add('Anička: ' + item.title);
  }
  return [...Object.values(pol),...vlastniPolozky()];
}
const KLIC_NAKUP = 'molcuchyne-nakup-' + TYDEN.od;
function mnozstvi(p) {
  if(p.vlastni)return p.mnozstviText;
  if (!p.m) return '';
  return cislo(p.m) + (p.j ? ' ' + p.j : '') + (p.bezMnozstvi ? ' a víc' : '');
}
function polozka(p, hotovo) {
  const ok = jeHotovo(p,hotovo);
  return `<label class="pol${ok ? ' ok' : ''}"><input type="checkbox" data-k="${p.k}"${p.vlastni?' data-vlastni="1"':''}${ok ? ' checked' : ''}>
    <span class="nm">${esc(p.n)}<span class="pro">${esc([...p.pro].join(', '))}</span></span><span class="mn">${esc(mnozstvi(p))}</span></label>`;
}
function vykresliNakup() {
  const hotovo = store.get(KLIC_NAKUP, []);
  const vse = seznam();
  const oddeleni = ['Lednice', 'Ovoce a zelenina', 'Pečivo', 'Trvanlivé', 'Vlastní položky'];
  let h = `<div class="top"><h1>Nákup</h1></div>
    <div class="akce"><button class="btn" id="kopirovat" type="button">Zkopírovat seznam</button></div><p id="nakup-status" role="status" class="small muted">${esc(nakupProblem)}</p><div class="nakup">`;
  for (const o of oddeleni) {
    const v = vse.filter(p => p.o === o);
    if (v.length) h += `<div class="skupina"><h3>${o}</h3>${v.map(p => p.vlastni?`<div class="own-shopping-row">${polozka(p,hotovo)}<button type="button" class="text-link" data-edit-item="${p.k}">Upravit</button></div>`:polozka(p,hotovo)).join('')}</div>`;
  }
  h += `</div>`;
  const doma = vse.filter(p => p.o === 'Doma');
  if (doma.length) h += `<details class="spiz"><summary>Doma nejspíš máš (${doma.length})</summary><div class="skupina">${doma.map(p => polozka(p, hotovo)).join('')}</div></details>`;
  $('#obsah').innerHTML = h;
  $('#obsah').querySelectorAll('input[data-k]').forEach(i => i.addEventListener('change', () => {
    if(i.dataset.vlastni){try{const items=nactiVlastniNakup(),item=items.find(x=>x.id===i.dataset.k);if(!item)throw Error('Položka nebyla nalezená.');item.checked=i.checked;ulozVlastniNakup(items);i.closest('.pol').classList.toggle('ok',i.checked);}catch(err){i.checked=!i.checked;nakupOznam(err.message);}return;}
    const s = new Set(store.get(KLIC_NAKUP, []));
    i.checked ? s.add(i.dataset.k) : s.delete(i.dataset.k);
    store.set(KLIC_NAKUP, [...s]);
    i.closest('.pol').classList.toggle('ok', i.checked);
  }));
  $('#kopirovat').addEventListener('click', async e => {
    const hot = store.get(KLIC_NAKUP, []);
    const text = seznam().filter(p => p.o !== 'Doma' && !jeHotovo(p,hot)).map(p => '- ' + p.n + (mnozstvi(p) ? ' ' + mnozstvi(p) : '')).join('\n');
    try { await navigator.clipboard.writeText(text); e.target.textContent = 'Zkopírováno'; }
    catch (err) { e.target.textContent = 'Kopírování nejde'; }
    setTimeout(() => e.target.textContent = 'Zkopírovat seznam', 2000);
  });
}

/* ===== Recepty ===== */
function vykresliRecepty() {
  let h = `<div class="top"><h1>Recepty</h1><p class="muted">Co je tento týden v plánu.</p></div><div class="karty">`;
  for (const [id, r] of Object.entries(RECEPTY)) {
    h += `<a class="karta" href="#recept/${id}">${(r.fotoNahled || r.foto) ? `<img src="${esc(r.fotoNahled || r.foto)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<span class="nm">${esc(r.nazev)}</span><span class="meta">${esc(r.cas)}${r.porce ? ', ' + r.porce + ' porce' : ''}</span></a>`;
  }
  $('#obsah').innerHTML = h + '</div>';
}
function vykresliRecept(id, porce) {
  const r = RECEPTY[id];
  if (!r) return vykresliRecepty();
  const p = porce || r.porce;
  const krat = r.porce ? p / r.porce : 1;
  const sur = r.suroviny.map(([k, m, pozn]) => {
    const s = SUROVINY[k];
    const mn = m != null ? cislo(m * krat) + (s.j ? ' ' + s.j : '') : '';
    return `<li>${esc(s.n)}${mn ? ' <b>' + esc(mn) + '</b>' : ''}${pozn ? ` <span>- ${esc(pozn)}</span>` : ''}</li>`;
  }).join('');
  let h = `<article class="recept"><a class="zpet" href="#recepty">Zpět na recepty</a>${r.foto ? `<img class="foto" src="${esc(r.foto)}" alt="${esc(r.nazev)}" onerror="this.remove()">` : ''}<h1>${esc(r.nazev)}</h1>
    <p class="meta">${esc(r.cas)}, v lednici: ${esc(r.lednice)}</p>
    <div class="poznamka">${r.poznamky.map(t => `<p>${esc(t)}</p>`).join('')}</div>
    <div class="dva"><section><h2>Suroviny</h2>`;
  if (r.porce) h += `<div class="porce"><button type="button" data-p="${Math.max(1, p - 1)}" aria-label="Méně porcí">-</button><span>${p} ${p === 1 ? 'porce' : p < 5 ? 'porce' : 'porcí'}</span><button type="button" data-p="${p + 1}" aria-label="Víc porcí">+</button></div>`;
  h += `<ul>${sur}</ul></section><section><h2>Postup</h2><ol>${r.postup.map(t => `<li>${esc(t)}</li>`).join('')}</ol>`;
  if (r.zdroj) h += `<p class="small muted">Zdroj: <a href="${esc(r.zdroj)}" target="_blank" rel="noopener">${esc(new URL(r.zdroj).hostname)}</a></p>`;
  h += `</section></div></article>`;
  $('#obsah').innerHTML = h;
  $('#obsah').querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
    history.replaceState(null, '', `#recept/${id}/${b.dataset.p}`); vykresliRecept(id, +b.dataset.p);
  }));
}

/* ===== Příkrmy ===== */
function vykresliPrikrmy(tab,id) { PrikrmyApp.render(tab,id); }

/* ===== Navigace a režim ===== */
function route() {
  const [r, id, porce] = (location.hash.slice(1) || 'tyden').split('/');
  const sekce = r === 'recept' ? 'recepty' : (r === 'den'||r === 'dnes') ? 'tyden' : r;
  document.querySelectorAll('[data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === sekce));
  if (r === 'nakup') vykresliNakup();
  else if (r === 'recepty') vykresliRecepty();
  else if (r === 'den') vykresliDen(id);
  else if (r === 'dnes') vykresliDnes();
  else if (r === 'prikrmy') vykresliPrikrmy(id,porce);
  else if (r === 'recept') vykresliRecept(id, porce ? +porce : null);
  else vykresliTyden();
  window.scrollTo(0, 0);
}
const SLUNCE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MESIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function ikonaRezimu() {
  const tmavy = document.documentElement.dataset.theme === 'dark';
  document.querySelectorAll('.rezim').forEach(b => b.innerHTML = tmavy ? MESIC : SLUNCE);
}
document.querySelectorAll('.rezim').forEach(b => b.addEventListener('click', () => {
  const novy = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = novy;
  try { localStorage.setItem('molcuchyne-rezim', novy) } catch (e) {}
  ikonaRezimu();
}));
ikonaRezimu();
// klik myší na položku menu nenechá na odkazu focus, ring zůstane jen pro klávesnici
document.querySelectorAll('.menu a, .dole a, .brand').forEach(a => a.addEventListener('mousedown', e => e.preventDefault()));
addEventListener('hashchange', route);
</script>
